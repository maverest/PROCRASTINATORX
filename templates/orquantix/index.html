<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orquantix</title>
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/orquantix/style.css">
</head>
<body>

  <a class="back-to-games" href="{{ url_for('home') }}">← Retour aux jeux</a>

  <!-- ===== Scène animée (Abysse) =====
       Décor derrière le jeu : vagues, bateau, bulles, orque qui saute,
       fille sur son rocher. Porté depuis .superpowers/brainstorm/.../
       abysse-scene.html (option A "Vivant"), orque-dessin.html (option A
       "Profil complet") et v6-easter-eggs.html (personnage corrigé).
       pointer-events: none partout — jamais d'interception de clic. -->
  <div class="scene-layer" id="sceneLayer" aria-hidden="true">

    <div class="scene-sub scene-back">
      <span class="scene-bubble" style="left:5%;   bottom:40px; width:5px; height:5px; animation-duration:9s;  animation-delay:0s"></span>
      <span class="scene-bubble" style="left:8%;   bottom:40px; width:3px; height:3px; animation-duration:12s; animation-delay:2.5s"></span>
      <span class="scene-bubble" style="left:3.5%; bottom:40px; width:7px; height:7px; animation-duration:14s; animation-delay:5s"></span>
      <span class="scene-bubble" style="left:93%;  bottom:40px; width:4px; height:4px; animation-duration:11s; animation-delay:1.5s"></span>
      <span class="scene-bubble" style="left:96%;  bottom:40px; width:6px; height:6px; animation-duration:15s; animation-delay:6.5s"></span>
    </div>

    <div class="scene-sub scene-back">
      <svg class="scene-breacher" width="150" height="75" viewBox="0 0 200 100" fill="none">
        <path d="M186,50 C180,36 166,28 146,25 C136,10 126,4 116,6 C118,14 122,21 128,25
                 C110,25 88,29 68,36 L46,20 C54,32 56,44 50,58 L74,49
                 C92,58 118,64 140,62 C162,60 180,56 186,50 Z" fill="#0a1620"/>
        <path d="M186,50 C178,54 164,58 148,60 C126,63 100,58 82,50
                 C96,54 118,56 138,54 C158,52 176,52 186,50 Z" fill="#eaf4fb"/>
        <ellipse cx="163" cy="41" rx="9" ry="5" transform="rotate(-12 163 41)" fill="#eaf4fb"/>
        <circle cx="171" cy="45" r="2.1" fill="#eaf4fb"/>
        <path d="M132,56 C138,66 146,72 156,73 C150,64 142,58 132,56 Z" fill="#071019"/>
      </svg>
    </div>

    <div class="scene-sub scene-back">
      <svg class="scene-wave scene-wave-1" viewBox="0 0 1200 110" preserveAspectRatio="none">
        <path d="M0,55 C150,20 300,90 450,55 C600,20 750,90 900,55 C1050,20 1125,75 1200,55 L1200,110 L0,110Z" fill="#123a5e" opacity=".55"/>
      </svg>
    </div>
    <div class="scene-sub scene-back">
      <svg class="scene-wave scene-wave-2" viewBox="0 0 1200 110" preserveAspectRatio="none">
        <path d="M0,68 C180,38 320,98 500,68 C680,38 820,98 1000,68 C1100,50 1160,80 1200,68 L1200,110 L0,110Z" fill="#0d2c49" opacity=".8"/>
      </svg>
    </div>

    <div class="scene-sub scene-front">
      <div class="scene-boat-track" id="sceneBoatTrack">
        <svg class="scene-boat" width="64" height="50" viewBox="0 0 52 40" fill="none">
          <path d="M8 30h34l-4 7H12z" fill="#7fe3f0" opacity=".85"/>
          <path d="M25 3v25" stroke="#7fe3f0" stroke-width="1.6" opacity=".7"/>
          <path d="M26 5l13 11H26z" fill="#7fe3f0" opacity=".55"/>
          <path d="M24 8L13 18h11z" fill="#7fe3f0" opacity=".35"/>
        </svg>
      </div>
    </div>

    <div class="scene-sub scene-front">
      <svg class="scene-wave scene-wave-3" viewBox="0 0 1200 110" preserveAspectRatio="none">
        <path d="M0,82 C200,58 340,104 520,82 C700,60 860,104 1040,82 C1120,72 1170,90 1200,82 L1200,110 L0,110Z" fill="#071827"/>
      </svg>
    </div>

    <div class="scene-rock" id="sceneRock">

        <path d="M5,94 C9,73 20,61 36,59 C54,57 68,65 72,80 C74,87 74,92 73,94 Z" fill="#0d2233"/>
        <g class="scene-girl-perso">
          <path d="M36.6,60 v-7 M44,60 v-7" stroke="#f2d3b8" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="33.4" y="45.4" width="13.6" height="9" rx="2.2" fill="#14181d"/>
          <g class="scene-girl-torse">
            <path d="M34.4,28 C33.2,33 33,38 34,42.6 C35.4,39 36,34 35.8,29.4 Z" fill="#4a3020"/>
            <path d="M45.6,28 C46.8,33 47,38 46,42.6 C44.6,39 44,34 44.2,29.4 Z" fill="#4a3020"/>

            <path d="M43.8,34 l4.6,4 -3.4,1.8 z" fill="#6b7a4a"/>
            <g class="scene-girl-calme">
              <path d="M31.8,39 C30.4,42.6 30.2,45.8 31,48.6" stroke="#f2d3b8" stroke-width="2.9" stroke-linecap="round"/>
              <path d="M48.2,39 C49.6,42.6 49.8,45.8 49,48.6" stroke="#f2d3b8" stroke-width="2.9" stroke-linecap="round"/>
            </g>
            <g class="scene-girl-joie">
              <path d="M33,36.6 C30.2,30 29.6,23 31,16.2" stroke="#f2d3b8" stroke-width="2.9" stroke-linecap="round"/>
              <path d="M47,36.6 C49.8,30 50.4,23 49,16.2" stroke="#f2d3b8" stroke-width="2.9" stroke-linecap="round"/>
              <circle cx="30.8" cy="14.8" r="1.9" fill="#f2d3b8"/>
              <circle cx="49.2" cy="14.8" r="1.9" fill="#f2d3b8"/>
            </g>
            <circle cx="40" cy="26.5" r="6.6" fill="#f6dcc4"/>
            <g class="scene-girl-calme">
              <circle cx="37.3" cy="27" r="1.2" fill="#2b2118"/>
              <circle cx="42.7" cy="27" r="1.2" fill="#2b2118"/>
              <path d="M38,30.6 q2,1.7 4,0" stroke="#2b2118" stroke-width="1" stroke-linecap="round" fill="none"/>
            </g>
            <g class="scene-girl-joie">
              <path d="M35.7,27 q1.6,-2.1 3.2,0" stroke="#2b2118" stroke-width="1.2" stroke-linecap="round" fill="none"/>
              <path d="M41.1,27 q1.6,-2.1 3.2,0" stroke="#2b2118" stroke-width="1.2" stroke-linecap="round" fill="none"/>
              <ellipse cx="40" cy="30.8" rx="2.5" ry="2.9" fill="#2b2118"/>
              <ellipse cx="40" cy="31.9" rx="1.5" ry="1.4" fill="#e0736b"/>
            </g>
            <path d="M33.5,24.6 a6.5,6.5 0 0 1 13,0 C42.6,23.2 37.4,23.2 33.5,24.6 Z" fill="#14181d"/>
            <path d="M46.3,24.4 C49.6,24.2 52.4,25 53.4,26.2 C51.6,27 48.4,27.2 45.6,26.6 Z" fill="#0a0d11"/>
            <path d="M33.5,24.6 C37.4,23.2 42.6,23.2 46.5,24.6 C46.5,25.4 46.4,26 46.2,26.4
                     C42.2,25.2 37.8,25.2 33.8,26.4 C33.6,26 33.5,25.4 33.5,24.6 Z" fill="#22262c"/>
          </g>
        </g>
      </svg>
    </div>

  </div>

  <div class="easter-egg-layer" id="easterEggLayer" aria-hidden="true">
    <div class="easter-egg easter-shachi" id="easterShachi">
      <img class="shachi-orchid" src="/static/easter_assets/shachi_orchid.png" alt="">
    </div>
    <div class="easter-egg easter-mathieu" id="easterMathieu">
      <img class="mathieu-pants" src="/static/easter_assets/mathieu_pants.png" alt="">
    </div>
    <div class="easter-egg easter-constance" id="easterConstance">
      <img class="constance-totem" src="/static/easter_assets/constance_totem.png" alt="">
    </div>
    <div class="easter-egg easter-kefir" id="easterKefir">
      <div class="kefir-rain" id="kefirRain"></div>
    </div>
    <div class="easter-egg easter-velo" id="easterVelo">
      <img class="easter-photo easter-photo-velo" src="/static/easter_assets/velo.png" alt="">
      <!-- Ajout : la fille traverse l'écran à vélo, fait demi-tour et
           revient, en flottant sur l'eau. Porté depuis v6-easter-eggs.html
           (#veloPiste). L'animation photo ci-dessus reste inchangée. -->
      <div class="velo-piste" id="veloPiste">
        <svg class="velo" width="96" height="78" viewBox="0 0 96 78" fill="none">
          <ellipse cx="48" cy="72" rx="30" ry="3.5" fill="#7fe3f0" opacity=".16"/>
          <g class="velo-wheel"><circle cx="24" cy="60" r="11" stroke="#ff8fab" stroke-width="2.4" fill="none"/>
            <path d="M24,49 v22 M13,60 h22 M16,52 l16,16 M32,52 l-16,16" stroke="#ff8fab" stroke-width=".9" opacity=".6"/></g>
          <g class="velo-wheel"><circle cx="70" cy="60" r="11" stroke="#ff8fab" stroke-width="2.4" fill="none"/>
            <path d="M70,49 v22 M59,60 h22 M62,52 l16,16 M78,52 l-16,16" stroke="#ff8fab" stroke-width=".9" opacity=".6"/></g>
          <path d="M24,60 L44,60 L54,42 L36,42 Z M44,60 L70,60 M54,42 L70,60" stroke="#f26aa0" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
          <path d="M36,42 L32,36 h8" stroke="#f26aa0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M54,42 v-6" stroke="#f26aa0" stroke-width="2.4" stroke-linecap="round"/>
          <g transform="translate(30,-4) scale(.62)">
            <path d="M36.6,60 v-7 M44,60 v-7" stroke="#f2d3b8" stroke-width="3.5" stroke-linecap="round"/>
            <rect x="33.4" y="45.4" width="13.6" height="9" rx="2.2" fill="#14181d"/>
            <path d="M34.4,28 C33.2,33 33,38 34,42.6 C35.4,39 36,34 35.8,29.4 Z" fill="#4a3020"/>
            <path d="M45.6,28 C46.8,33 47,38 46,42.6 C44.6,39 44,34 44.2,29.4 Z" fill="#4a3020"/>
            <path d="M36,33.4 a4.6,4.6 0 0 1 8,0 L47.4,45.8 C42.4,47.2 37.6,47.2 32.6,45.8 Z" fill="#6b7a4a"/>
            <path d="M44,36 C50,38 54,41 56,45" stroke="#f2d3b8" stroke-width="2.9" stroke-linecap="round"/>
            <circle cx="40" cy="26.5" r="6.6" fill="#f6dcc4"/>
            <path d="M35.7,27 q1.6,-2.1 3.2,0" stroke="#2b2118" stroke-width="1.2" stroke-linecap="round" fill="none"/>
            <path d="M41.1,27 q1.6,-2.1 3.2,0" stroke="#2b2118" stroke-width="1.2" stroke-linecap="round" fill="none"/>
            <ellipse cx="40" cy="30.8" rx="2.4" ry="2.7" fill="#2b2118"/>
            <path d="M33.5,24.6 a6.5,6.5 0 0 1 13,0 C42.6,23.2 37.4,23.2 33.5,24.6 Z" fill="#14181d"/>
            <path d="M46.3,24.4 C49.6,24.2 52.4,25 53.4,26.2 C51.6,27 48.4,27.2 45.6,26.6 Z" fill="#0a0d11"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="easter-egg easter-stluc" id="easterStLuc">
      <img class="easter-photo easter-photo-stluc" src="/static/easter_assets/stluc.png" alt="">
    </div>
    <div class="easter-egg easter-mullet" id="easterMullet">
      <img class="easter-photo easter-photo-mullet" src="/static/easter_assets/mullet_scissors.png" alt="">
    </div>
    <div class="easter-egg easter-voisin" id="easterVoisin">
      <img class="easter-photo easter-photo-voisin" src="/static/easter_assets/voisin.png" alt="">
    </div>

    <!-- Charlie : le bateau traverse avec Charlie à bord. Cliquable —
         porté depuis charlie.html. -->
    <div class="easter-egg easter-charlie" id="easterCharlie">
      <div class="charlie-track" id="charlieTrack">
        <svg class="charlie-boat" id="charlieBoat" width="86" height="68" viewBox="0 0 86 68" fill="none" onclick="triggerCharlieParty()">
          <path d="M10,50 h58 l-7,12 H17 z" fill="#7fe3f0" opacity=".9"/>
          <path d="M42,10 v40" stroke="#7fe3f0" stroke-width="2" opacity=".75"/>
          <path d="M44,13 l19,20 H44 z" fill="#7fe3f0" opacity=".5"/>
          <path d="M40,18 L24,36 h16 z" fill="#7fe3f0" opacity=".32"/>
          <g id="charlieFigure">
            <path d="M28,50 v-6 M34,50 v-6" stroke="#1f4b8f" stroke-width="3" stroke-linecap="round"/>
            <rect x="25" y="33" width="12" height="12" rx="2.5" fill="#eaf4fb"/>
            <path d="M25,35.5h12M25,39h12M25,42.5h12" stroke="#e03131" stroke-width="2"/>
            <path d="M25,36 l-5,5" stroke="#eaf4fb" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M37,36 l5,5" stroke="#eaf4fb" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="31" cy="27" r="5.2" fill="#f6d9be"/>
            <circle cx="29" cy="27" r="1.9" fill="none" stroke="#22303b" stroke-width=".9"/>
            <circle cx="33.4" cy="27" r="1.9" fill="none" stroke="#22303b" stroke-width=".9"/>
            <path d="M30.9,27h1.6" stroke="#22303b" stroke-width=".9"/>
            <path d="M25.6,24 a5.6,5.6 0 0 1 10.8,0 z" fill="#eaf4fb"/>
            <path d="M26.2,22.6h9.6M27.6,20.6h6.8" stroke="#e03131" stroke-width="1.6"/>
            <circle cx="31" cy="17.4" r="2" fill="#e03131"/>
            <path d="M26.4,28.6 a5,5 0 0 0 1.4,2.4" stroke="#6b3b18" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M35.6,28.6 a5,5 0 0 1 -1.4,2.4" stroke="#6b3b18" stroke-width="1.4" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="charlie-party" id="charlieParty"></div>
    </div>

    <!-- Aigles : trois rapaces traversent en plané, décalés en taille et
         en profondeur. Porté depuis v6-easter-eggs.html (#aigles). -->
    <div class="easter-egg easter-aigles" id="easterAigles">
      <div class="aigles-flight" id="aiglesFlight">
        <svg width="240" height="80" viewBox="0 0 240 80" fill="none">
          <g opacity=".9">
            <path class="aigle-wing" d="M18,26 C26,16 36,14 44,20 C36,22 30,26 26,32 C22,26 20,25 18,26 Z" fill="#0a1620"/>
            <path class="aigle-wing" d="M62,26 C54,16 44,14 36,20 C44,22 50,26 54,32 C58,26 60,25 62,26 Z" fill="#0a1620"/>
            <path d="M36,20 h8 l-2,12 h-4 z" fill="#0a1620"/>
            <circle cx="40" cy="18" r="3" fill="#e8dcc4"/>
            <path d="M43,18 l4,1.4 -4,1.4 z" fill="#ffd23f"/>
          </g>
          <g opacity=".65" transform="translate(84,26) scale(.75)">
            <path class="aigle-wing" style="animation-delay:.3s" d="M18,26 C26,16 36,14 44,20 C36,22 30,26 26,32 C22,26 20,25 18,26 Z" fill="#0a1620"/>
            <path class="aigle-wing" style="animation-delay:.3s" d="M62,26 C54,16 44,14 36,20 C44,22 50,26 54,32 C58,26 60,25 62,26 Z" fill="#0a1620"/>
            <path d="M36,20 h8 l-2,12 h-4 z" fill="#0a1620"/>
            <circle cx="40" cy="18" r="3" fill="#e8dcc4"/>
            <path d="M43,18 l4,1.4 -4,1.4 z" fill="#ffd23f"/>
          </g>
          <g opacity=".45" transform="translate(150,-8) scale(.55)">
            <path class="aigle-wing" style="animation-delay:.65s" d="M18,26 C26,16 36,14 44,20 C36,22 30,26 26,32 C22,26 20,25 18,26 Z" fill="#0a1620"/>
            <path class="aigle-wing" style="animation-delay:.65s" d="M62,26 C54,16 44,14 36,20 C44,22 50,26 54,32 C58,26 60,25 62,26 Z" fill="#0a1620"/>
            <path d="M36,20 h8 l-2,12 h-4 z" fill="#0a1620"/>
            <circle cx="40" cy="18" r="3" fill="#e8dcc4"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- ===== Download / Loading screen ===== -->
  <div class="download-screen" id="downloadScreen">
    <h1 class="app-title">Orquantix</h1>
    <p class="download-intro">
      Ca chargggeeeeee c'est pas long !
    </p>
    <div class="download-progress-container">
      <div class="download-progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <p class="download-detail" id="downloadDetail">Initialisation…</p>
    <p class="download-error" id="downloadError" style="display:none"></p>
  </div>

  <!-- ===== Game screen ===== -->
  <div class="game-screen" id="gameScreen" style="display:none">

    <header class="game-header">
      <h1 class="app-title">Orquantix</h1>
      <div class="game-meta">
        <span class="daily-difficulty" id="dailyDifficulty"></span>
        <span class="timer-display" id="timerDisplay">Timer : --:--</span>
        <button class="new-game-btn give-up-btn" id="giveUpBtn" onclick="giveUp()">
          I give up
        </button>
        <button class="new-game-btn" id="timerBtn" onclick="startTimerMode()">
          Mode timer
        </button>
        <button class="new-game-btn" id="hintToggleBtn" onclick="toggleHintPanel()">
          Indices
        </button>
        <button class="new-game-btn dyslexic-toggle" id="dyslexicToggle" onclick="toggleDyslexic()">
          Mode dyslexique : OFF
        </button>
      </div>
    </header>

    <form class="guess-form" id="guessForm" onsubmit="submitGuess(event)">
      <input
        type="text"
        id="guessInput"
        class="guess-input"
        placeholder="Proposez un mot…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <button type="submit" class="submit-btn">Valider</button>
    </form>

    <p class="error-message" id="errorMessage" style="display:none"></p>

    <div class="suggestion-box" id="suggestionBox" style="display:none">
      Vouliez-vous dire <strong id="suggestionWord"></strong>&nbsp;?
      <button class="suggestion-yes" onclick="acceptSuggestion()">Oui</button>
      <button class="suggestion-no" onclick="dismissSuggestion()">Non</button>
    </div>

    <div class="hint-panel" id="hintPanel" style="display:none">
      <button class="hint-btn" onclick="requestHint('first-letter')">Première lettre</button>
      <button class="hint-btn hint-btn-elegant" onclick="requestHint('word-length')">Nombre de lettres</button>
      <button class="hint-btn hint-btn-dirty" onclick="requestHint('better-word')">Mot plus proche</button>
    </div>

    <div class="orca-tools" id="orcaTools">
      <div class="orca-tool" draggable="true" data-orca-tool="neutral">
        <span class="orca-tool-icon" aria-hidden="true">💧</span>
        <span class="orca-tool-label">Eau calme</span>
      </div>
      <div class="orca-tool" draggable="true" data-orca-tool="mute">
        <span class="orca-tool-icon" aria-hidden="true">🩹</span>
        <span class="orca-tool-label">Scotché</span>
      </div>
      <div class="orca-tool" draggable="true" data-orca-tool="trashtalk">
        <span class="orca-tool-icon" aria-hidden="true">🧃</span>
        <span class="orca-tool-label">Trash talk juice</span>
      </div>
      <div class="orca-tool orca-tool-hint" draggable="true" data-orca-tool="golden-fish">
        <span class="orca-tool-icon" aria-hidden="true">🐟</span>
        <span class="orca-tool-label">Poisson doré</span>
      </div>
    </div>

    <div class="orca-panel orca-intrigued" id="orcaPanel">
      <div class="orca-avatar" id="orcaAvatar" aria-hidden="true">
        <img class="orca-avatar-image" id="orcaAvatarImage" src="/static/orca_assets/orque_base.png" alt="">
        <span class="orca-accessory" id="orcaAccessory"></span>
      </div>
      <div class="orca-dialog">
        <div class="orca-bubble" id="orcaBubble">Ola que tal</div>
        <div class="orca-status">
          <button class="orca-replay-btn" id="orcaReplayBtn" type="button" onclick="newGame()" style="display:none">
            Rejouer
          </button>
        </div>
      </div>
    </div>

    <table class="guess-table" id="guessTable">
      <thead>
        <tr>
          <th class="col-num">#</th>
          <th class="col-word">Mot</th>
          <th class="col-progress">Proximité</th>
          <th class="col-rank">Rang</th>
          <th class="col-orca">Orque</th>
        </tr>
      </thead>
      <tbody id="guessTableBody"></tbody>
    </table>

  </div><!-- /.game-screen -->

  <script src="/static/orquantix/orca.js"></script>
  <script src="/static/orquantix/game.js"></script>
</body>
</html>
